log_format structured_json escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"service":"bodarequest-frontend",'
  '"environment":"production",'
  '"level":"info",'
  '"message":"http_request",'
  '"request_id":"$msec-$connection-$connection_requests",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"status_code":$status,'
  '"request_time_seconds":$request_time,'
  '"upstream_response_time":"$upstream_response_time",'
  '"client_ip":"$remote_addr",'
  '"user_agent":"$http_user_agent"'
'}';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/bodarequest/frontend-access.log structured_json;

  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $msec-$connection-$connection_requests;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
