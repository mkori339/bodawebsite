name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tag
        id: image_tag
        run: echo "value=sha-${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bodarequest-backend:${{ steps.image_tag.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bodarequest-backend:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/bodarequest-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bodarequest-frontend:${{ steps.image_tag.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bodarequest-frontend:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/bodarequest-frontend:latest

  deploy-staging:
    needs: build-and-push
    runs-on: self-hosted
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare staging deployment directory
        if: ${{ vars.STAGING_DEPLOY_MODE != 'local' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            sudo mkdir -p "${{ secrets.STAGING_APP_DIR }}"
            sudo chown -R "${{ secrets.STAGING_USERNAME }}:${{ secrets.STAGING_USERNAME }}" "${{ secrets.STAGING_APP_DIR }}"

      - name: Copy deployment files to staging server
        if: ${{ vars.STAGING_DEPLOY_MODE != 'local' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "deploy/docker-compose.deploy.yml,backend/database/schema.sql,mosquitto/config/mosquitto.conf"
          target: ${{ secrets.STAGING_APP_DIR }}

      - name: Prepare local staging deployment directory
        if: ${{ vars.STAGING_DEPLOY_MODE == 'local' }}
        run: |
          DEPLOY_DIR="${{ secrets.STAGING_APP_DIR }}"
          PARENT_DIR="$(dirname "$DEPLOY_DIR")"
          if { [ -e "$DEPLOY_DIR" ] && [ ! -w "$DEPLOY_DIR" ]; } || [ ! -w "$PARENT_DIR" ]; then
            DEPLOY_DIR="$HOME/bodarequest-staging"
            echo "Configured STAGING_APP_DIR is not writable by the runner. Using $DEPLOY_DIR instead."
          fi
          echo "STAGING_RUNTIME_APP_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"
          mkdir -p "$DEPLOY_DIR/deploy"
          mkdir -p "$DEPLOY_DIR/backend/database"
          mkdir -p "$DEPLOY_DIR/mosquitto/config"
          install -m 0644 deploy/docker-compose.deploy.yml "$DEPLOY_DIR/deploy/docker-compose.deploy.yml"
          install -m 0644 backend/database/schema.sql "$DEPLOY_DIR/backend/database/schema.sql"
          install -m 0644 mosquitto/config/mosquitto.conf "$DEPLOY_DIR/mosquitto/config/mosquitto.conf"

      - name: Deploy to staging
        if: ${{ vars.STAGING_DEPLOY_MODE != 'local' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 30m
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            sudo mkdir -p "${{ secrets.STAGING_APP_DIR }}"
            sudo chown -R "${{ secrets.STAGING_USERNAME }}:${{ secrets.STAGING_USERNAME }}" "${{ secrets.STAGING_APP_DIR }}"
            cd "${{ secrets.STAGING_APP_DIR }}"
            printf '%s\n%s\n' "${{ secrets.STAGING_ENV_FILE }}" "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" > .env
            set -a
            . ./.env
            set +a
            : "${IMAGE_NAMESPACE:?STAGING_ENV_FILE is missing IMAGE_NAMESPACE}"
            : "${MYSQL_ROOT_PASSWORD:?STAGING_ENV_FILE is missing MYSQL_ROOT_PASSWORD}"
            : "${MYSQL_DATABASE:?STAGING_ENV_FILE is missing MYSQL_DATABASE}"
            : "${JWT_SECRET:?STAGING_ENV_FILE is missing JWT_SECRET}"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose -f deploy/docker-compose.deploy.yml pull
            docker compose -f deploy/docker-compose.deploy.yml up -d
            docker compose -f deploy/docker-compose.deploy.yml ps
            
            # MQTT Real-time Verification
            echo "Verifying MQTT real-time communication..."
            docker compose -f deploy/docker-compose.deploy.yml exec -T mqtt sh -c "mosquitto_sub -h localhost -p 1883 -t deploy/check -C 1" > mqtt_verify.txt &
            sleep 5
            docker compose -f deploy/docker-compose.deploy.yml exec -T mqtt mosquitto_pub -h localhost -p 1883 -t deploy/check -m "staging-mqtt-verified"
            sleep 2
            if grep -q "staging-mqtt-verified" mqtt_verify.txt; then
              echo "MQTT Verification Success: Message received by subscriber."
            else
              echo "MQTT Verification Failed: Subscriber did not receive message."
              exit 1
            fi

            sleep 15
            curl -fsS "http://localhost:${FRONTEND_PORT}" > /dev/null || {
              docker compose -f deploy/docker-compose.deploy.yml ps
              docker compose -f deploy/docker-compose.deploy.yml logs --tail=100 frontend backend db mqtt
              exit 1
            }
            curl -fsS "http://localhost:${BACKEND_PORT}/api/health" || {
              docker compose -f deploy/docker-compose.deploy.yml ps
              docker compose -f deploy/docker-compose.deploy.yml logs --tail=100 frontend backend db mqtt
              exit 1
            }

      - name: Deploy to local staging server
        if: ${{ vars.STAGING_DEPLOY_MODE == 'local' }}
        run: |
          mkdir -p "$STAGING_RUNTIME_APP_DIR"
          cd "$STAGING_RUNTIME_APP_DIR"
          printf '%s\n%s\n' "${{ secrets.STAGING_ENV_FILE }}" "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" > .env
          set -a
          . ./.env
          set +a
          : "${IMAGE_NAMESPACE:?STAGING_ENV_FILE is missing IMAGE_NAMESPACE}"
          : "${MYSQL_ROOT_PASSWORD:?STAGING_ENV_FILE is missing MYSQL_ROOT_PASSWORD}"
          : "${MYSQL_DATABASE:?STAGING_ENV_FILE is missing MYSQL_DATABASE}"
          : "${JWT_SECRET:?STAGING_ENV_FILE is missing JWT_SECRET}"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker compose -f deploy/docker-compose.deploy.yml pull
          docker compose -f deploy/docker-compose.deploy.yml up -d
          docker compose -f deploy/docker-compose.deploy.yml ps
          
          # MQTT Real-time Verification
          echo "Verifying MQTT real-time communication..."
          docker compose -f deploy/docker-compose.deploy.yml exec -T mqtt sh -c "mosquitto_sub -h localhost -p 1883 -t deploy/check -C 1" > mqtt_verify.txt &
          sleep 5
          docker compose -f deploy/docker-compose.deploy.yml exec -T mqtt mosquitto_pub -h localhost -p 1883 -t deploy/check -m "staging-mqtt-verified"
          sleep 2
          if grep -q "staging-mqtt-verified" mqtt_verify.txt; then
            echo "MQTT Verification Success: Message received by subscriber."
          else
            echo "MQTT Verification Failed: Subscriber did not receive message."
            exit 1
          fi

          sleep 15
          curl -fsS "http://localhost:${FRONTEND_PORT}" > /dev/null || {
            docker compose -f deploy/docker-compose.deploy.yml ps
            docker compose -f deploy/docker-compose.deploy.yml logs --tail=100 frontend backend db mqtt
            exit 1
          }
          curl -fsS "http://localhost:${BACKEND_PORT}/api/health" || {
            docker compose -f deploy/docker-compose.deploy.yml ps
            docker compose -f deploy/docker-compose.deploy.yml logs --tail=100 frontend backend db mqtt
            exit 1
          }

  deploy-production:
    needs:
      - build-and-push
      - deploy-staging
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare production deployment directory
        if: ${{ vars.PRODUCTION_DEPLOY_MODE != 'local' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            sudo mkdir -p "${{ secrets.PRODUCTION_APP_DIR }}"
            sudo chown -R "${{ secrets.PRODUCTION_USERNAME }}:${{ secrets.PRODUCTION_USERNAME }}" "${{ secrets.PRODUCTION_APP_DIR }}"

      - name: Copy deployment files to production server
        if: ${{ vars.PRODUCTION_DEPLOY_MODE != 'local' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "deploy/docker-compose.deploy.yml,backend/database/schema.sql,mosquitto/config/mosquitto.conf"
          target: ${{ secrets.PRODUCTION_APP_DIR }}

      - name: Prepare local production deployment directory
        if: ${{ vars.PRODUCTION_DEPLOY_MODE == 'local' }}
        run: |
          DEPLOY_DIR="${{ secrets.PRODUCTION_APP_DIR }}"
          PARENT_DIR="$(dirname "$DEPLOY_DIR")"
          if { [ -e "$DEPLOY_DIR" ] && [ ! -w "$DEPLOY_DIR" ]; } || [ ! -w "$PARENT_DIR" ]; then
            DEPLOY_DIR="$HOME/bodarequest-production"
            echo "Configured PRODUCTION_APP_DIR is not writable by the runner. Using $DEPLOY_DIR instead."
          fi
          echo "PRODUCTION_RUNTIME_APP_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"
          mkdir -p "$DEPLOY_DIR/deploy"
          mkdir -p "$DEPLOY_DIR/backend/database"
          mkdir -p "$DEPLOY_DIR/mosquitto/config"
          install -m 0644 deploy/docker-compose.deploy.yml "$DEPLOY_DIR/deploy/docker-compose.deploy.yml"
          install -m 0644 backend/database/schema.sql "$DEPLOY_DIR/backend/database/schema.sql"
          install -m 0644 mosquitto/config/mosquitto.conf "$DEPLOY_DIR/mosquitto/config/mosquitto.conf"

      - name: Deploy to production
        if: ${{ vars.PRODUCTION_DEPLOY_MODE != 'local' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          command_timeout: 30m
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            sudo mkdir -p "${{ secrets.PRODUCTION_APP_DIR }}"
            sudo chown -R "${{ secrets.PRODUCTION_USERNAME }}:${{ secrets.PRODUCTION_USERNAME }}" "${{ secrets.PRODUCTION_APP_DIR }}"
            cd "${{ secrets.PRODUCTION_APP_DIR }}"
            printf '%s\n%s\n' "${{ secrets.PRODUCTION_ENV_FILE }}" "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" > .env
            set -a
            . ./.env
            set +a
            : "${IMAGE_NAMESPACE:?PRODUCTION_ENV_FILE is missing IMAGE_NAMESPACE}"
            : "${MYSQL_ROOT_PASSWORD:?PRODUCTION_ENV_FILE is missing MYSQL_ROOT_PASSWORD}"
            : "${MYSQL_DATABASE:?PRODUCTION_ENV_FILE is missing MYSQL_DATABASE}"
            : "${JWT_SECRET:?PRODUCTION_ENV_FILE is missing JWT_SECRET}"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose -f deploy/docker-compose.deploy.yml pull
            docker compose -f deploy/docker-compose.deploy.yml up -d
            docker compose -f deploy/docker-compose.deploy.yml ps
            
            # MQTT Real-time Verification
            echo "Verifying MQTT real-time communication..."
            docker compose -f deploy/docker-compose.deploy.yml exec -T mqtt sh -c "mosquitto_sub -h localhost -p 1883 -t deploy/check -C 1" > mqtt_verify.txt &
            sleep 5
            docker compose -f deploy/docker-compose.deploy.yml exec -T mqtt mosquitto_pub -h localhost -p 1883 -t deploy/check -m "production-mqtt-verified"
            sleep 2
            if grep -q "production-mqtt-verified" mqtt_verify.txt; then
              echo "MQTT Verification Success: Message received by subscriber."
            else
              echo "MQTT Verification Failed: Subscriber did not receive message."
              exit 1
            fi

            sleep 15
            curl -fsS "http://localhost:${FRONTEND_PORT}" > /dev/null || {
              docker compose -f deploy/docker-compose.deploy.yml ps
              docker compose -f deploy/docker-compose.deploy.yml logs --tail=100 frontend backend db mqtt
              exit 1
            }
            curl -fsS "http://localhost:${BACKEND_PORT}/api/health" || {
              docker compose -f deploy/docker-compose.deploy.yml ps
              docker compose -f deploy/docker-compose.deploy.yml logs --tail=100 frontend backend db mqtt
              exit 1
            }

      - name: Deploy to local production server
        if: ${{ vars.PRODUCTION_DEPLOY_MODE == 'local' }}
        run: |
          mkdir -p "$PRODUCTION_RUNTIME_APP_DIR"
          cd "$PRODUCTION_RUNTIME_APP_DIR"
          printf '%s\n%s\n' "${{ secrets.PRODUCTION_ENV_FILE }}" "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" > .env
          set -a
          . ./.env
          set +a
          : "${IMAGE_NAMESPACE:?PRODUCTION_ENV_FILE is missing IMAGE_NAMESPACE}"
          : "${MYSQL_ROOT_PASSWORD:?PRODUCTION_ROOT_PASSWORD is missing MYSQL_ROOT_PASSWORD}"
          : "${MYSQL_DATABASE:?PRODUCTION_ENV_FILE is missing MYSQL_DATABASE}"
          : "${JWT_SECRET:?PRODUCTION_ENV_FILE is missing JWT_SECRET}"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker compose -f deploy/docker-compose.deploy.yml pull
          docker compose -f deploy/docker-compose.deploy.yml up -d
          docker compose -f deploy/docker-compose.deploy.yml ps
          
          # MQTT Real-time Verification
          echo "Verifying MQTT real-time communication..."
          docker compose -f deploy/docker-compose.deploy.yml exec -T mqtt sh -c "mosquitto_sub -h localhost -p 1883 -t deploy/check -C 1" > mqtt_verify.txt &
          sleep 5
          docker compose -f deploy/docker-compose.deploy.yml exec -T mqtt mosquitto_pub -h localhost -p 1883 -t deploy/check -m "production-mqtt-verified"
          sleep 2
          if grep -q "production-mqtt-verified" mqtt_verify.txt; then
            echo "MQTT Verification Success: Message received by subscriber."
          else
            echo "MQTT Verification Failed: Subscriber did not receive message."
            exit 1
          fi

          sleep 15
          curl -fsS "http://localhost:${FRONTEND_PORT}" > /dev/null || {
