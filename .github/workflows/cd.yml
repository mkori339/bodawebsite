          curl -fsS "http://localhost:${BACKEND_PORT}/api/health" || {
            docker compose -f deploy/docker-compose.deploy.yml ps
            docker compose -f deploy/docker-compose.deploy.yml logs --tail=100 frontend backend db mqtt
            exit 1
          }
