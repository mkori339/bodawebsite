name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm --workspace backend run test

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t bodarequest-backend:${{ github.sha }} .

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t bodarequest-frontend:${{ github.sha }} .
