name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests with coverage
        run: npm --workspace backend run test -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 14

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t bodarequest-backend:${{ github.sha }} .

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t bodarequest-frontend:${{ github.sha }} .
